services:
  main:
    depends_on:
      odoo:
        condition: service_healthy
  db:
    image: postgres:16.6
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: seedpass
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 5s
      timeout: 5s
      retries: 40
  odoo:
    image: odoo:18.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      USER: odoo
      PASSWORD: seedpass
    command:
      - /bin/bash
      - -c
      - >-
        odoo --db_host=db --db_user=odoo --db_password=seedpass -d alecn -i base,stock,purchase,sale_management,mrp,account,stock_landed_costs,mrp_subcontracting,purchase_stock,sale_stock,stock_dropshipping,hr_expense --without-demo=all --stop-after-init --http-interface=0.0.0.0 &&
        exec odoo --db_host=db --db_user=odoo --db_password=seedpass -d alecn --http-interface=0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8069/web/login >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 90
      start_period: 120s
networks:
  default:
    internal: true
