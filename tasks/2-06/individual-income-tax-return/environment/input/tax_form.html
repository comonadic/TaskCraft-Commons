<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>综合所得仿真申报</title><style>body{max-width:850px;margin:35px auto;font:20px sans-serif}label{display:block;margin:15px}input{float:right;font-size:20px}button{font-size:22px;padding:12px}</style><h1>2024 综合所得仿真申报</h1><p>合成材料，本地练习</p><select id="taxpayer_id"><option>T001</option><option>T002</option><option>T003</option></select><form id="form"><label>收入<input id="income" type="number" step="0.01" required></label><label>专项扣除<input id="special_deduction" type="number" step="0.01" required></label><label>专项附加扣除<input id="additional_deduction" type="number" step="0.01" required></label><label>应纳税所得额<input id="taxable_income" type="number" step="0.01" required></label><label>应纳税额<input id="tax_due" type="number" step="0.01" required></label><label>已预缴<input id="prepaid" type="number" step="0.01" required></label><label>补退税<input id="balance" type="number" step="0.01" required></label><button type="submit">保存结果</button></form><p id="status"></p><script>
document.querySelector('#form').onsubmit=e=>{e.preventDefault();const r={taxpayer_id:document.querySelector('#taxpayer_id').value,year:2024};for(const k of ["income", "special_deduction", "additional_deduction", "taxable_income", "tax_due", "prepaid", "balance"])r[k]=Number(document.getElementById(k).value);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(r,null,2)],{type:'application/json'}));a.download=r.taxpayer_id+'.json';a.click();document.querySelector('#status').textContent='已保存 '+r.taxpayer_id;};
</script></html>
