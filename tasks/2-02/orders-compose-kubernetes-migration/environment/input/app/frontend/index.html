<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>合成订单系统</title><body><h1>青岚订单（合成）</h1><div id="root"></div><script src="/react.js"></script><script src="/react-dom.js"></script><script>function App(){const [s,set]=React.useState('正在加载');React.useEffect(()=>{fetch('/api/health').then(r=>r.json()).then(x=>set(JSON.stringify(x)))},[]);return React.createElement('pre',null,s)}ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App))</script></body></html>
