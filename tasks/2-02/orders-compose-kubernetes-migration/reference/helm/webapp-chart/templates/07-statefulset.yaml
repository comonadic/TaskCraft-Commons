apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  labels:
    app: webapp
    tier: db
spec:
  serviceName: db-service
  replicas: 1
  selector:
    matchLabels:
      app: webapp
      tier: db
  template:
    metadata:
      labels:
        app: webapp
        tier: db
    spec:
      containers:
      - name: db
        image: postgres:16.6
        imagePullPolicy: Never
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: orders
        - name: POSTGRES_USER
          value: seed
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: password
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: source
          mountPath: /docker-entrypoint-initdb.d/init.sql
          subPath: init.sql
          readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 512Mi
      volumes:
      - name: source
        configMap:
          name: app-config
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
